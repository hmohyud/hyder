# Push to main -> build the portfolio, publish it to GitHub Pages (gh-pages
# branch, custom domain via public/CNAME), then deploy the chat worker to
# Cloudflare. Equivalent to `npm run deploy` in site/, run by GitHub instead.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
name: deploy site + chat worker

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: portfolio-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # install (not ci) in legacy-peer mode: this tree has peer conflicts that
      # only resolve that way; puppeteer is a dev tool, skip its Chromium download
      - run: npm install --legacy-peer-deps --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # offline harness: fakes the model APIs and checks the chat worker's chain,
      # spend meter and failure paths before anything is published
      - run: npm run test:chat

      # CI=false so CRA's lint warnings stay warnings, as in a local build
      - run: npm run build
        env:
          CI: "false"

      - name: publish site to gh-pages
        run: >
          npx gh-pages -d build --nojekyll
          -u "GitHub Actions <actions@github.com>"
          -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          -m "deploy site ${GITHUB_SHA}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # the worker needs an API token secret; until it exists, warn instead
      # of failing the run (the site above has already been published)
      - name: deploy chat worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run chat:deploy

      - name: chat worker skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning title=chat worker not deployed::add the CLOUDFLARE_API_TOKEN repository secret (Cloudflare token from the 'Edit Cloudflare Workers' template), then re-run this workflow"
