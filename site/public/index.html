    <!-- ===== LOADER (inline — paints before any JS bundle) ===== -->
    <style>
      body { margin: 0; background: #0b0d12; }

      #loader {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d12;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #loader.loader-exit {
        opacity: 0;
      }
      #loader-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .loader-logo {
        position: relative;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }

      /* Impact bloom: fires when letters "collide" mid-assembly */
      .loader-impact {
        position: absolute;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        width: 340px;
        height: 340px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(184, 255, 216, 0.35) 0%,
          rgba(158, 216, 255, 0.14) 35%,
          rgba(183, 197, 255, 0.06) 60%,
          transparent 72%
        );
        mix-blend-mode: screen;
        pointer-events: none;
        opacity: 0;
        z-index: 2;
      }
      #loader.go .loader-impact {
        animation: softBloom 0.4s 0.3s ease-out forwards;
      }

      @keyframes softBloom {
        0%   { transform: scale(0.35); opacity: 0; }
        25%  { opacity: 1; }
        100% { transform: scale(2.3);  opacity: 0; }
      }

      /* Formed, and the app is still loading: the logo breathes. A CSS
         animation on opacity runs on the compositor, so it keeps going even
         while the app's first run has the main thread. */
      #loader.wait #loader-canvas {
        animation: loaderBreathe 1.8s ease-in-out infinite;
      }
      @keyframes loaderBreathe {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.55; }
      }

      @media (prefers-reduced-motion: reduce) {
        .go .loader-impact { animation: none !important; opacity: 0; }
        #loader.wait #loader-canvas { animation: none; }
      }
    </style>
  </head>
  <body style="background:#0b0d12">
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Splash loader — visible instantly, dismissed by React -->
    <div id="loader">
      <canvas id="loader-canvas"></canvas>
      <div class="loader-logo">
        <div class="loader-impact"></div>
      </div>
    </div>
    <script>
      /* Particle-assembly splash loader.
         260-480 dots in the site's 4-colour palette stream in from the edges,
         resolve into the H and M silhouettes, and hold until the app is up.

         Built to be the first thing on screen and to stay smooth:
         - Nothing ahead of it blocks its first paint. In a build, the page's
           stylesheet sits below it and blocks nothing, and the app bundle is
           only preloaded; a small script there runs the bundle once the
           stylesheet is in and this says the logo has formed - or, in a tab
           opened in the background, once the bundle has fully downloaded, so
           it runs while still hidden (build-route-shells.mjs). The bundle's
           long first run used to land mid-animation and freeze the dots for
           up to a second.
         - It starts on its own first frame, not on `load`.
         - Motion is a closed-form ease over animation time: the same pace at
           60, 120 or 240 Hz, and a stalled frame slows it rather than making
           it jump ahead.
         - The letters are sampled with a point-in-polygon test, not a canvas
           read-back.
         - Once formed it stops drawing. If the app is still loading after a
           beat, the logo breathes through a CSS animation, which runs off the
           main thread.

         It reports two things on window, each as a flag and an event:
           __appGo / "app-go"            the app bundle may run now
           __loaderDone / "loader-done"  the logo has formed; App.js may
                                         dismiss the loader
         Every way out of this script (skip, reduced motion, no canvas, an
         error) reports both, so the app is never left waiting on it. */
      (function(){
        var sent = {};
        function report(name, flag) {
          if (sent[name]) return;
          sent[name] = 1;
          window[flag] = true;
          try { window.dispatchEvent(new Event(name)); } catch (_) {}
        }
        function appGo() { report('app-go', '__appGo'); }
        function done() { appGo(); report('loader-done', '__loaderDone'); }

        try { run(); } catch (_) { done(); }

        function run() {
          // Skip the splash when returning from the art gallery. Blocked
          // storage throws here; that only means there is no skip.
          var skip = false;
          try {
            skip = !!sessionStorage.getItem('skip-loader');
            if (skip) sessionStorage.removeItem('skip-loader');
          } catch (_) {}
          if (skip) {
            var el = document.getElementById('loader');
            if (el) el.remove();
            done();
            return;
          }

          var loader = document.getElementById('loader');
          var canvas = document.getElementById('loader-canvas');
          var ctx = canvas && canvas.getContext && canvas.getContext('2d');
          if (!loader || !ctx) { done(); return; }

          /* Palette - dark ends of the four landing-page card accent bars
             (Skills / Projects / About / Resume). Mirrors the on-page UI. */
          var COLORS = ['#ff72a1', '#b48bff', '#7fd3ff', '#78ffa8'];

          /* Colour modes - one at random per load. Each gets local coords
             inside the logo box (0..w, 0..h) and returns a COLORS index. */
          var COLOR_MODES = [
            function(x, y, w, h) {              // diagonal NW -> SE stripes
              return Math.min(3, Math.floor(((x / w + y / h) / 2) * 4));
            },
            function(x, y, w, h) {              // diagonal NE -> SW stripes
              return Math.min(3, Math.floor((((w - x) / w + y / h) / 2) * 4));
            },
            function(x, y, w, h) {              // horizontal bands
              return Math.min(3, Math.floor((y / h) * 4));
            },
            function(x, y, w, h) {              // vertical bands
              return Math.min(3, Math.floor((x / w) * 4));
            },
            function(x, y, w, h) {              // radial rings
              var dx = x - w / 2, dy = y - h / 2;
              var r = Math.sqrt(dx * dx + dy * dy);
              var rmax = Math.sqrt((w / 2) * (w / 2) + (h / 2) * (h / 2));
              return Math.min(3, Math.floor((r / rmax) * 4));
            },
            function(x, y, w, h) {              // quadrants
              return (y >= h / 2 ? 2 : 0) + (x >= w / 2 ? 1 : 0);
            },
          ];
          var colorMode = COLOR_MODES[(Math.random() * COLOR_MODES.length) | 0];

          /* The monogram as two polygons (they share the middle stem) */
          var H_POLY = [[8,0],[20,0],[20,28],[49,28],[49,0],[61,0],[61,68],[49,68],[49,40],[20,40],[20,68],[8,68]];
          var M_POLY = [[49,0],[63,0],[75,30],[87,0],[101,0],[101,68],[89,68],[89,22],[77,50],[73,50],[61,22],[61,68],[49,68]];
          var LOGO_W = 120, LOGO_H = 68;
          var BOX = { minX: 8, maxX: 101, minY: 0, maxY: 68 };   // both letters' bounds
          var SCALE_MAX = 3.8;
          var SCALE = SCALE_MAX;      // recomputed on resize so the logo fits any viewport
          var PER_LETTER = window.innerWidth < 700 ? 130 : 240; // phones draw a smaller logo - fewer dots, same density

          /* Timing: each dot waits up to MAX_DELAY, then eases in over DUR.
             The ease is exponential-out, normalised to land exactly on its
             target, so the logo is complete at DONE_AT (the 720 ms the
             splash was always designed around) with no endless tail. */
          var DUR = 600, MAX_DELAY = 120, DONE_AT = MAX_DELAY + DUR;
          var EASE_NORM = 1 / (1 - Math.pow(2, -10));
          function ease(u) { return u >= 1 ? 1 : (1 - Math.pow(2, -10 * u)) * EASE_NORM; }
          var WAIT_AFTER = 450;       // formed and still waiting this long: breathe

          var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          var vw = 0, vh = 0, cx = 0, cy = 0, offX = 0, offY = 0;
          var particles = [];
          function resize() {
            /* React removes the loader after exit but this listener would
               live on, re-allocating a full-viewport backing store for a
               detached canvas on every resize - self-remove once orphaned */
            if (!canvas.isConnected) {
              window.removeEventListener('resize', resize);
              if (mo) mo.disconnect();
              return;
            }
            vw = window.innerWidth;
            vh = window.innerHeight;
            var dpr = Math.min(vw < 700 ? 1.5 : 2, window.devicePixelRatio || 1);
            canvas.width  = Math.floor(vw * dpr);
            canvas.height = Math.floor(vh * dpr);
            canvas.style.width  = vw + 'px';
            canvas.style.height = vh + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cx = vw / 2;
            cy = vh / 2;
            // Fit the logo with comfortable margins on both axes
            var contentW = BOX.maxX - BOX.minX, contentH = BOX.maxY - BOX.minY;
            SCALE = Math.max(1, Math.min(SCALE_MAX, (vw - 40) / contentW, (vh - 80) / contentH));
            offX = cx - ((BOX.minX + BOX.maxX) / 2) * SCALE;
            offY = cy - ((BOX.minY + BOX.maxY) / 2) * SCALE;
            for (var i = 0; i < particles.length; i++) {
              var p = particles[i];
              p.tx = offX + p.lx * SCALE;
              p.ty = offY + p.ly * SCALE;
            }
            // a resize clears the canvas: put the current state straight back
            if (byColor) paint(t);
          }

          /* n uniform random points inside a polygon (even-odd rule) */
          function inside(poly, x, y) {
            var c = false;
            for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
              var xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
              if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
            }
            return c;
          }
          function samplePoly(poly, n) {
            var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (var i = 0; i < poly.length; i++) {
              minX = Math.min(minX, poly[i][0]); maxX = Math.max(maxX, poly[i][0]);
              minY = Math.min(minY, poly[i][1]); maxY = Math.max(maxY, poly[i][1]);
            }
            var out = [], tries = n * 40;
            while (out.length < n && tries-- > 0) {
              var x = minX + Math.random() * (maxX - minX);
              var y = minY + Math.random() * (maxY - minY);
              if (inside(poly, x, y)) out.push([x, y]);
            }
            return out;
          }

          var byColor = null, t = 0;
          var mo = null;
          resize();
          window.addEventListener('resize', resize);

          var maxD = Math.max(vw, vh) * 0.9;
          function pushPs(targets, biasAngle) {
            for (var i = 0; i < targets.length; i++) {
              var lx = targets[i][0], ly = targets[i][1];
              var angle = biasAngle + (Math.random() - 0.5) * Math.PI * 1.2;
              var dist  = maxD * (0.55 + Math.random() * 0.55);
              particles.push({
                lx: lx, ly: ly,                          // logo units - re-projected on resize
                tx: offX + lx * SCALE,
                ty: offY + ly * SCALE,
                sx: cx + Math.cos(angle) * dist,         // spawn, off towards the edges
                sy: cy + Math.sin(angle) * dist,
                c: colorMode(lx, ly, LOGO_W, LOGO_H),
                size: 1.2 + Math.random() * 1.1,
                // staggered so the first dots move on the very first frames
                delay: Math.random() * MAX_DELAY,
              });
            }
          }
          pushPs(samplePoly(H_POLY, PER_LETTER), Math.PI);   // H streams in from the left
          pushPs(samplePoly(M_POLY, PER_LETTER), 0);         // M streams in from the right

          /* Bucketed by colour once, so each pass is one path and one fill
             per colour rather than one of each per dot. */
          byColor = [[], [], [], []];
          for (var bi = 0; bi < particles.length; bi++) byColor[particles[bi].c].push(particles[bi]);

          /* The whole scene at animation time `at` (ms): dots not yet
             released sit at their spawn, faint; the rest ease toward their
             targets on one shared fade-in. paint(0) is the opening frame,
             paint(DONE_AT) the finished logo. */
          var TWO_PI = Math.PI * 2;
          function paint(at) {
            ctx.clearRect(0, 0, vw, vh);
            var ramp = Math.min(1, at / 240);
            for (var c = 0; c < 4; c++) {
              var bucket = byColor[c], i, p, drew;
              ctx.fillStyle = COLORS[c];
              ctx.globalAlpha = 0.22;
              ctx.beginPath();
              drew = false;
              for (i = 0; i < bucket.length; i++) {
                p = bucket[i];
                if (at > p.delay) continue;
                ctx.moveTo(p.sx + p.size, p.sy);
                ctx.arc(p.sx, p.sy, p.size, 0, TWO_PI);
                drew = true;
              }
              if (drew) ctx.fill();
              ctx.globalAlpha = 0.22 + 0.78 * ramp;
              ctx.beginPath();
              drew = false;
              for (i = 0; i < bucket.length; i++) {
                p = bucket[i];
                if (at <= p.delay) continue;
                var e = ease((at - p.delay) / DUR);
                var x = p.sx + (p.tx - p.sx) * e, y = p.sy + (p.ty - p.sy) * e;
                ctx.moveTo(x + p.size, y);
                ctx.arc(x, y, p.size, 0, TWO_PI);
                drew = true;
              }
              if (drew) ctx.fill();
            }
            ctx.globalAlpha = 1;
          }
          paint(0);   // the very first paint already shows the opening frame

          var phase = 'waiting';      // waiting -> running -> formed, or exiting at any point
          var last = null, rafId = 0, waitTimer = 0;
          mo = new MutationObserver(function(){
            if (loader.classList.contains('loader-exit') && phase !== 'exiting') {
              phase = 'exiting';
              if (rafId) cancelAnimationFrame(rafId);
              clearTimeout(waitTimer);
            }
          });
          mo.observe(loader, { attributes: true, attributeFilter: ['class'] });

          function formed() {
            phase = 'formed';
            t = DONE_AT;
            paint(DONE_AT);
            done();
            waitTimer = setTimeout(function(){
              if (phase === 'formed' && loader.isConnected) loader.classList.add('wait');
            }, WAIT_AFTER);
          }

          function frame() {
            rafId = 0;
            if (phase !== 'running') return;
            // Animation time advances by real elapsed time, but a long stall
            // counts as one ordinary frame: the dots resume where they were
            // instead of jumping to where they would have been.
            var now = performance.now();
            if (last != null) {
              var dt = now - last;
              t += dt > 50 ? 33 : dt;
            }
            last = now;
            if (t >= DONE_AT) { formed(); return; }
            paint(t);
            rafId = requestAnimationFrame(frame);
          }

          function start() {
            if (phase !== 'waiting') return;
            if (document.prerendering || document.visibilityState !== 'visible') return;
            // The app came up while the tab was in the background (App.js sets
            // __appUp): show the finished logo instead of assembling it over
            // the app's first frames.
            if (reduced || window.__appUp) { formed(); return; }
            phase = 'running';
            loader.classList.add('go');
            rafId = requestAnimationFrame(frame);
          }

          if (document.prerendering || document.visibilityState !== 'visible') {
            /* Opened in a background tab or prerendered: let the app load
               now, and play the splash when the page is actually seen. */
            appGo();
            document.addEventListener('visibilitychange', start);
            document.addEventListener('prerenderingchange', start);
          }
          start();
        }
      })();
    </script>

    <!-- GitHub Pages SPA: restore path from 404.html redirect -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
